name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Fast checks that need no voice model or render: shell lint, JS and Python
# syntax, JSON files, script.md compile, and the Linux Chrome lookup. A full
# render needs the models (about 1.5 GB), so it is checked by hand
# (npm run video --piece=examples/hello) before a release.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: shellcheck
        run: shellcheck -x -S warning scripts/*.sh explainer/*.sh

      - name: JavaScript syntax
        run: for f in tools/*.js explainer/*.js; do node --check "$f"; done

      - name: Python syntax
        run: python -m py_compile tools/*.py explainer/*.py explainer/template/story.py motion/examples/hello/story.py

      - name: JSON files
        run: for f in package.json brand.example.json explainer/themes/*.json; do python -m json.tool "$f" >/dev/null; done

      - name: compile script.md
        run: |
          python explainer/script.py motion/examples/hello >/dev/null
          cp -r explainer/template "$RUNNER_TEMP/template"
          python explainer/script.py "$RUNNER_TEMP/template" >/dev/null

      - name: Chrome lookup (Linux)
        run: node tools/chrome.js
