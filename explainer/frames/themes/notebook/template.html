<!doctype html>

<head>

<!-- Three-page video: 1 the problem (field), 2 the notebook sheet, 3 Binary Semaphore.
     Copy to motion/<group>/<piece>/page.html, then replace every TODO. Beats in this skeleton:
     0 problem; 1 to 7 the sheet; 8 brand. The sheet is 2160 x 3840: header row y 120 to 560,
     cells of about 970 x 700, the bottom row ends by y 2960; "save this page" sits at y 3030. -->
<title>TODO two to four words</title>
<link rel="stylesheet" href="../../../explainer/frames/themes/base/base.css">

</head>
<body>

<!-- page 1: the problem -->
<div class="frame" data-from="0" data-to="0">

  </svg>

<!-- page 2: the notebook sheet -->
<div class="frame notebook" data-from="1" data-to="7">
  <div id="canvas">
    <div class="h w" style="left:0;width:2160px;text-align:center;top:170px;font-size:140px" data-w="b1-0.2|0.8">TODO TITLE</div>
    <div class="t w dim" style="left:0;width:2160px;text-align:center;top:335px" data-w="b1|0.6">TODO subtitle</div>

    <svg class="cv" width="2160" height="3840">
      <!-- ruled edges that run past each other at the corners -->
      <path class="pen edge" data-t0="b1-0.3" data-t1="b1+0.2" d="M 60 124 C 700 120, 1400 126, 2104 120"/>
      <path class="pen edge" data-t0="b1-0.1" data-t1="b1+0.4" d="M 2050 70 C 2054 1100, 2048 2100, 2052 3014"/>
      <path class="pen edge" data-t0="b1+0.1" data-t1="b1+0.6" d="M 2104 2962 C 1400 2966, 700 2958, 58 2964"/>
      <path class="pen edge" data-t0="b1+0.3" data-t1="b1+0.8" d="M 112 3016 C 108 2100, 114 1100, 110 68"/>
      <!-- section lines in the second pen: header, centre column, rows -->
      <path class="pen divide" data-t0="b1+0.5" data-t1="b1+0.9" d="M 70 562 C 700 558, 1400 566, 2094 560"/>
      <path class="pen divide" data-t0="b1+0.7" data-t1="b1+1.1" d="M 1078 520 C 1082 1200, 1076 2200, 1080 3004"/>

      <path class="pen divide" data-t0="b6" data-t1="b6+0.4" d="M 70 2662 C 700 2658, 1400 2666, 2094 2660"/>
      <!-- a connector (yellow marker): drawn in the zoomed-out view at the end of its beat -->
      <path class="pen yelp" data-head="1" id="c1" d="M 900 900 C 980 900, 1100 900, 1180 900"/>
      <!-- a little ink person in a cell -->
      <g class="el" data-at="b1+1"><ellipse cx="900" cy="1182" rx="28" ry="6" fill="rgba(4,22,12,.45)"/><use class="ink" href="#point" transform="translate(900 1180) scale(1.2) scale(-1 1)"/></g>
    </svg>

    <!-- cell 1 (top left); write each note with class "w" and data-w="spec|seconds" -->
    <div class="h w" style="left:170px;top:610px" data-w="w1:TODO|0.6">1 · TODO</div>
    <div class="t w" style="left:190px;top:740px" data-w="w1:TODO|0.8">TODO note</div>
    <div class="m w" style="left:190px;top:840px" data-w="w1:TODO|0.8">code_or_numbers()</div>

    <div class="t w yel" style="left:0;width:2160px;text-align:center;top:3030px;font-size:56px" data-w="w7:TODO+0.6|0.8">save this page</div>

</div>
